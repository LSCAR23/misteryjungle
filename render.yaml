# Blueprint de Render: solo la API FastAPI (Docker), plan free en Ohio.
# La base de datos está en Neon (Postgres serverless) y el frontend en Vercel.
# Los secretos usan `sync: false`: se cargan en el dashboard de Render, nunca en este archivo.
services:
  - type: web
    name: misteryjungle-api
    runtime: docker
    plan: free
    region: ohio
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Cadena de conexión de Neon (con ?sslmode=require)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_MOCK_DATA
        value: "true"
      # Contraseña de los 4 usuarios iniciales
      - key: SEED_PASSWORD
        sync: false
      # Dominio(s) del frontend en Vercel, separados por coma
      - key: CORS_ORIGINS
        sync: false
