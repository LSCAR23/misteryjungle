# Blueprint de Render: base de datos Postgres + API FastAPI (Docker), plan free en Ohio.
# El frontend va en Vercel. Los secretos usan `sync: false`: Render los pide al crear el Blueprint.
databases:
  - name: misteryjungle-db
    plan: free
    region: ohio
    postgresMajorVersion: "16"
    databaseName: misteryjungle
    user: mj

services:
  - type: web
    name: misteryjungle-api
    runtime: docker
    plan: free
    region: ohio
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: misteryjungle-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_MOCK_DATA
        value: "true"
      # Contraseña de los 4 usuarios iniciales (se pide al crear el Blueprint)
      - key: SEED_PASSWORD
        sync: false
      # Dominio(s) del frontend en Vercel, separados por coma
      - key: CORS_ORIGINS
        sync: false
